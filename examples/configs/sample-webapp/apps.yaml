apps:
  - id: sample-internal-app
    environment: local
    base_url: http://localhost:8000
    host_targets:
      - localhost
    target_allowlist:
      - localhost
      - 127.0.0.1
    auth:
      method: none
    health_endpoint: /health
    metrics:
      endpoint: http://localhost:9090/metrics
    enabled_modules:
      - pentest
      - chaos
