profiles:
  - name: dependency-timeout-observation
    fault_type: timeout
    target_service: upstream-gateway
    baseline_duration_seconds: 30
    experiment_duration_seconds: 60
    abort_thresholds:
      consecutive_health_failures: 2
      max_error_rate: 0.05
    rollback:
      method: toxiproxy_reset
      description: Remove timeout simulation and verify API health recovery.
