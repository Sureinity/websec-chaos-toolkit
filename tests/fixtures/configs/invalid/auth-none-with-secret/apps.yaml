apps:
  - id: auth-none-with-secret
    environment: local
    base_url: http://localhost:8000
    host_targets:
      - localhost
    target_allowlist:
      - localhost
      - 127.0.0.1
    auth:
      method: none
      token_env_var: SHOULD_NOT_BE_ALLOWED
    health_endpoint: /health
    enabled_modules:
      - pentest
