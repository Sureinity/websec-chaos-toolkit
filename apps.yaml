apps:
  - id: sample-internal-app
    environment: local
    base_url: http://localhost:8000
    host_targets:
      - localhost
    target_allowlist:
      - localhost
      - 127.0.0.1
    auth:
      method: none
    health_endpoint: /health
    metrics:
      endpoint: http://localhost:9090/metrics
    enabled_modules:
      - pentest
      - chaos

  - id: sample-staging-auth-app
    environment: staging
    base_url: https://staging.internal.example
    host_targets:
      - staging.internal.example
    target_allowlist:
      - staging.internal.example
    auth:
      method: form
      login_url: https://staging.internal.example/login
      username_env_var: SECURITY_TEST_USERNAME
      password_env_var: SECURITY_TEST_PASSWORD
    health_endpoint: /health
    enabled_modules:
      - pentest
