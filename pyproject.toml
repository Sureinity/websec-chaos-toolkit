[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "internal-security-toolkit"
version = "0.1.0"
description = "Bootstrap scaffold for safe internal pentest and chaos orchestration."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
  {name = "Infosoft"},
]
dependencies = [
  "httpx>=0.27,<1.0",
  "jinja2>=3.1,<4.0",
  "prometheus-client>=0.20,<1.0",
  "pydantic>=2.7,<3.0",
  "PyYAML>=6.0,<7.0",
  "rich>=13,<15",
  "tenacity>=9,<10",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2.0",
  "pre-commit>=3.7,<5.0",
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<7.0",
  "respx>=0.21,<1.0",
  "ruff>=0.5,<1.0",
]

[project.scripts]
toolkit = "toolkit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/toolkit"]
